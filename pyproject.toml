[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditrail"
version = "0.1.0"
description = "Black-box trajectory collection and audit tool for xuanjian-agent."
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
agent = [
  "deepagents>=0.6.12",
  "langchain>=0.3",
  "langchain-deepseek>=0.1",
  "langgraph>=0.2",
  "langgraph-checkpoint>=2",
]
# Phase 5 production extras. All three are imported lazily: the application
# still boots in file/inline/local mode without them, and every entry point
# that needs one fails with an explicit, actionable error instead.
# - psycopg: PostgreSQL metadata backend (SQLite stays the embedded default).
# - redis:   optional queue broker hint (database stays the source of truth).
# - PyJWT + cryptography: OIDC/JWT token verification (JWKS, RS256/HS256).
production = [
  "psycopg[binary]>=3.1",
  "redis>=5",
  "PyJWT>=2.8",
  "cryptography>=41",
]
# The canonical test environment exercises the production code paths too
# (SQLite is stdlib, but the OIDC/JWT and Postgres/Redis adapter tests need
# these importable), so dev includes them.
dev-full = [
  "pytest>=8",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "redis>=5",
  "PyJWT>=2.8",
  "cryptography>=41",
]

[project.scripts]
auditrail = "auditrail.cli:main"

[tool.setuptools.packages.find]
include = ["auditrail*"]
exclude = ["runs*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: opt-in smoke test that spawns a real DSH binary (skipped unless AUDITRAIL_DSH_INTEGRATION=1)",
]

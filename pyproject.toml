[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditrail"
version = "0.1.0"
description = "Black-box trajectory collection and audit tool for xuanjian-agent."
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
agent = [
  "deepagents>=0.6.12",
  "langchain>=0.3",
  "langchain-deepseek>=0.1",
  "langgraph>=0.2",
  "langgraph-checkpoint>=2",
]

[project.scripts]
auditrail = "auditrail.cli:main"

[tool.setuptools.packages.find]
include = ["auditrail*"]
exclude = ["runs*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
